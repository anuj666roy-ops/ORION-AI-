name: Build ORION AI APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check Android Project
        run: |
          echo "Checking project files..."
          ls -la

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: Android app module not found!"
            exit 1
          fi

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper is missing."

            sudo apt-get update
            sudo apt-get install -y unzip curl

            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.5-bin.zip \
              -o /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp

            /tmp/gradle-8.5/bin/gradle wrapper \
              --gradle-version 8.5 \
              --distribution-type bin
          fi

          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find . -type f -name "*.apk" -print
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload ORION AI APK
        uses: actions/upload-artifact@v4
        with:
          name: OrionAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
