name: Build ORION AI APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Check Project Files
        run: |
          pwd
          ls -la
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

      - name: Install Gradle and Generate Wrapper if Needed
        run: |
          if [ ! -f gradlew ]; then
            sudo apt-get update
            sudo apt-get install -y unzip curl

            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.5-bin.zip \
              -o /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp

            /tmp/gradle-8.5/bin/gradle wrapper \
              --gradle-version 8.5 \
              --distribution-type bin
          fi

          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload ORION AI APK
        uses: actions/upload-artifact@v4
        with:
          name: OrionAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
